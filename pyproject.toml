[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mechrl"
version = "0.0.1"
description = "RL agent for circuit discovery in transformer language models"
requires-python = ">=3.10"
dependencies = []  # actual deps tracked in requirements.txt

[tool.setuptools.packages.find]
where = ["."]
include = ["mechrl*"]
