[tool.poetry]
name = "acdc"
version = "0.0.0" # This should automatically be set by the CD pipeline on release
description = "ACDC: Automatic Circuit DisCovery implementation on top of TransformerLens"
authors = ["Arthur Conmy, Adrià Garriga-Alonso"]
license = "MIT"
readme = "README.md"
packages = [{include = "acdc"}, {include = "subnetwork_probing"}]

[tool.poetry.dependencies]
# Dependencies relaxed for MechRL project: dropped pygraphviz (viz only),
# tracr (unused task), kaleido/plotly/cmapy/wandb (viz/logging),
# torchtyping (replaced by jaxtyping upstream). torch and transformer-lens
# bumped to modern versions. See top-level requirements.txt for the actual
# install list — these constraints exist mainly to satisfy poetry-core.
python = ">=3.10,<4.0"
einops = ">=0.6.0"
numpy = ">=1.23"
torch = ">=2.6"
datasets = ">=2.7.1"
transformers = ">=4.35.0"
tokenizers = ">=0.15.0"
tqdm = ">=4.64.1"
pandas = ">=1.1.5"
huggingface-hub = ">=0.16.0"
networkx = ">=3.1"
transformer-lens = ">=3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
pytest-cov = "^4.0.0"
jupyterlab = "^3.5.0"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    # Ignore numpy.distutils deprecation warning caused by pandas
    # More info: https://numpy.org/doc/stable/reference/distutils.html#module-numpy.distutils
    "ignore:distutils Version classes are deprecated:DeprecationWarning"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
